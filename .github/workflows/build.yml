name: Build ProtoHax

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # submodules disabled: pinned submodule mccheatz/mcpedata is dead (404),
          # data is fetched from a mirror below instead.
          submodules: false

      - name: Fetch mcpedata (submodule mirror)
        run: |
          rm -rf src/main/resources/assets/mcpedata
          git clone --depth 1 https://github.com/CloudPixel-Studio/mcpedata.git src/main/resources/assets/mcpedata
          ls src/main/resources/assets/mcpedata

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar --no-daemon --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProtoHax-jar
          path: build/libs/*.jar
